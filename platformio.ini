; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.partitions = default.csv

; config.h lives in the project root so both PlatformIO and the Arduino IDE
; can find it.
build_flags =
    -I.
    -DCORE_DEBUG_LEVEL=1

build_unflags =
    -Os

lib_deps =
    blynkkk/Blynk@^1.3.2
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    mikalhart/TinyGPSPlus@^1.0.3

; Optional: run unit tests on the host for the pure logic (SOC curve, haversine)
[env:native]
platform      = native
test_framework = unity
build_flags   = -I.
test_ignore   = esp32dev
